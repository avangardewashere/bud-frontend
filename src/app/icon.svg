<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Bud">
  <!--
    Design.md §2: a single closed bud on a short stem with two leaves, emerald,
    gold highlight on the tip. Filled shapes, no outlines. Reads at 16px — at
    that size it should look like a green blob with a yellow dot, which is correct.
  -->
  <path d="M32 58V34" stroke="#047857" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- leaves, deliberately asymmetric: the right one sits higher -->
  <path d="M32 44c-3-9-11-12-17-11 0 7 6 13 17 11z" fill="#059669"/>
  <path d="M32 38c3-10 12-13 18-12 0 8-7 14-18 12z" fill="#34D399"/>
  <!-- the closed bud, tilted -->
  <path d="M32 34c-7 0-11-6-11-13 0-8 5-15 11-15s11 7 11 15c0 7-4 13-11 13z" fill="#059669"/>
  <circle cx="32" cy="8" r="5" fill="#FBBF24"/>
</svg>
